<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Kanban colaborativo</title>
    <script>
      ;(function () {
        try {
          var t = JSON.parse(localStorage.getItem('taskflow_theme'))
          var s = t && t.state
          var theme = s && s.theme
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (s && s.accent) {
            var root = document.documentElement.style
            root.setProperty('--color-brand-500', s.accent)
            var mix = function (hex, target, w) {
              var c = hex.replace('#', '')
              var full =
                c.length === 3 ? c.split('').map(function (x) { return x + x }).join('') : c
              var n = parseInt(full, 16)
              var r1 = (n >> 16) & 255, g1 = (n >> 8) & 255, b1 = n & 255
              var t2 = parseInt(target.replace('#', ''), 16)
              var r2 = (t2 >> 16) & 255, g2 = (t2 >> 8) & 255, b2 = t2 & 255
              var hex2 = function (v) { return Math.round(v).toString(16).padStart(2, '0') }
              return '#' + hex2(r1 + (r2 - r1) * w) + hex2(g1 + (g2 - g1) * w) + hex2(b1 + (b2 - b1) * w)
            }
            var steps = [['50', '#ffffff', 0.92], ['100', '#ffffff', 0.84], ['200', '#ffffff', 0.68], ['300', '#ffffff', 0.5], ['400', '#ffffff', 0.26], ['600', '#000000', 0.12], ['700', '#000000', 0.24], ['800', '#000000', 0.36], ['900', '#000000', 0.5]]
            for (var i = 0; i < steps.length; i++) {
              root.setProperty('--color-brand-' + steps[i][0], mix(s.accent, steps[i][1], steps[i][2]))
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
